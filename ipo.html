<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laker's IPO — Initial Parashah Offering</title>
<meta name="description" content="You are invited to Laker's IPO (Initial Parashah Offering) — a bar mitzvah in San Francisco on October 24th, 2026.">

<!-- Keep the invitation out of search results. Deliberately NOT paired with a
     robots.txt disallow: blocking the crawl would stop crawlers from ever
     reading this tag, and a blocked URL can still be listed from inbound links. -->
<meta name="robots" content="noindex, nofollow">

<!-- The invitation itself lives at ipo.lakernewhouse.com (repo: Arongil/ipo).
     This page is only a signpost, so there is one file to edit, not two.
     GitHub Pages can't issue a server-side 301, hence meta refresh + JS. -->
<link rel="canonical" href="https://ipo.lakernewhouse.com">
<meta http-equiv="refresh" content="0; url=https://ipo.lakernewhouse.com">
<script>window.location.replace("https://ipo.lakernewhouse.com" + window.location.hash);</script>

<!-- Kept so a shared lakernewhouse.com/ipo link still previews properly:
     scrapers read og: tags but don't always follow a meta refresh. -->
<meta property="og:title" content="Laker's IPO — Initial Parashah Offering">
<meta property="og:description" content="A bar mitzvah in San Francisco. Saturday, the twenty-fourth of October, two thousand twenty-six.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ipo.lakernewhouse.com">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>

    .flourish { color: #d8c9ad; }
    p {
        margin: 0;
        font-size: 1.3rem;
        font-style: italic;
        font-weight: 300;

        color: #9c7b45;
